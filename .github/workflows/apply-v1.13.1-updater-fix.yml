name: Apply v1.13.1 updater fix

on:
  push:
    paths:
      - '.github/workflows/apply-v1.13.1-updater-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/apply-v1.13.1-updater-fix.js
      - name: Validate
        run: |
          node --check lib/updater.js
          node --check lib/index.js
          npm test
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/updater.js lib/index.js package.json CHANGELOG.md test/updater.test.js
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'fix: update active DSH profile and verify release install'
          git push origin HEAD:main
      # rerun marker: linked-profile tests updated
