name: Publish v1.11.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.11.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: f9f095940e5a4371a2918d5c9f7b90d82210598c
          RELEASE_NOTES: |
            ## Highlights

            - SiliconFlow balance queries now use only the API key referenced by the model provider named `siliconflow`, with actionable setup errors when it is missing.
            - SiliconFlow's public `totalBalance`, `chargeBalance`, and `balance` fields are defined and displayed faithfully, including successful zero responses.
            - DigitalOcean account PATs can be entered, securely saved, masked, and used to query current balance plus month-to-date usage without billing history.
            - DigitalOcean negative account balances are presented as available credit.
            - DeepSeek balance status rendering and AMD GPU Cloud guidance are improved.

            Verification: 13 tests passed together with syntax, package-contract, and diff checks.
        run: |
          if gh release view v1.11.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v1.11.0 already exists; skipping."
          else
            gh release create v1.11.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --title "v1.11.0" \
              --notes "$RELEASE_NOTES"
          fi
