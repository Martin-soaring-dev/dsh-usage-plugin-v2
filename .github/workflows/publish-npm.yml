name: Publish fork to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/npm-publish-request.json

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-dsh-usage-plugin-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package contract
        run: node scripts/check-package.js

      - name: Run tests
        run: node --test

      - name: Verify independent package identity
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='dsh-usage-plugin-v2'||p.version!=='1.11.0') throw new Error('unexpected package identity: '+p.name+'@'+p.version)"

      - name: Authenticate, publish, and verify
        id: npm_publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is not configured."
            exit 1
          fi

          npm whoami --registry=https://registry.npmjs.org

          if npm view dsh-usage-plugin-v2@1.11.0 version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "dsh-usage-plugin-v2@1.11.0 is already published; skipping upload."
          else
            npm publish --access public --provenance --registry=https://registry.npmjs.org
          fi

          for attempt in 1 2 3 4 5 6; do
            published="$(npm view dsh-usage-plugin-v2@1.11.0 version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "1.11.0" ]; then
              echo "Verified dsh-usage-plugin-v2@1.11.0 on npm."
              exit 0
            fi
            sleep 10
          done

          echo "::error::npm did not return dsh-usage-plugin-v2@1.11.0 after publication."
          exit 1

      - name: Record publication result
        if: always()
        uses: actions/github-script@v8
        env:
          PUBLISH_OUTCOME: ${{ steps.npm_publish.outcome }}
        with:
          script: |
            const path = '.github/npm-publish-result.json'
            const payload = JSON.stringify({
              package: 'dsh-usage-plugin-v2',
              version: '1.11.0',
              outcome: process.env.PUBLISH_OUTCOME || 'unknown',
              runId: context.runId,
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              workflowCommit: context.sha,
              recordedAt: new Date().toISOString()
            }, null, 2) + '\n'

            let sha
            try {
              const response = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref: 'main'
              })
              if (!Array.isArray(response.data)) sha = response.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch: 'main',
              message: 'ci: record independent npm publication result',
              content: Buffer.from(payload).toString('base64'),
              ...(sha ? { sha } : {})
            })

      - name: Fail when publication did not succeed
        if: always() && steps.npm_publish.outcome != 'success'
        run: exit 1
