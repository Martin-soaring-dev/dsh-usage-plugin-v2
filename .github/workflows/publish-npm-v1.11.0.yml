name: Publish npm v1.11.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-npm-v1.11.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: v1.11.0
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify package contract
        run: node scripts/check-package.js

      - name: Run tests
        run: node --test

      - name: Verify exact package identity
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='@feiyang666/dsh-usage-plugin'||p.version!=='1.11.0') { throw new Error('unexpected package identity: '+p.name+'@'+p.version) }"

      - name: Authenticate, publish, and verify
        id: npm_publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is not configured."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
          if npm view @feiyang666/dsh-usage-plugin@1.11.0 version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@feiyang666/dsh-usage-plugin@1.11.0 is already published; skipping."
          else
            npm publish --access public --registry=https://registry.npmjs.org
          fi
          test "$(npm view @feiyang666/dsh-usage-plugin@1.11.0 version --registry=https://registry.npmjs.org)" = "1.11.0"

      - name: Record publication result
        if: always()
        uses: actions/github-script@v7
        env:
          PUBLISH_OUTCOME: ${{ steps.npm_publish.outcome }}
        with:
          script: |
            const path = '.github/npm-publish-v1.11.0-status.json'
            const payload = JSON.stringify({
              package: '@feiyang666/dsh-usage-plugin',
              version: '1.11.0',
              outcome: process.env.PUBLISH_OUTCOME || 'skipped',
              runId: context.runId,
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              workflowCommit: context.sha,
              recordedAt: new Date().toISOString()
            }, null, 2) + '\n'
            let sha
            try {
              const response = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref: 'main'
              })
              if (!Array.isArray(response.data)) sha = response.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch: 'main',
              message: 'ci: record npm v1.11.0 publication result',
              content: Buffer.from(payload).toString('base64'),
              ...(sha ? { sha } : {})
            })

      - name: Fail when npm publication did not succeed
        if: always() && steps.npm_publish.outcome != 'success'
        run: exit 1
