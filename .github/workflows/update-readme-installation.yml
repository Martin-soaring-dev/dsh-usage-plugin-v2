name: Update README installation guide

on:
  push:
    paths:
      - '.github/workflows/update-readme-installation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update READMEs
        run: node scripts/update-readme-installation.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh.md
          if git diff --cached --quiet; then
            echo 'No README changes.'
            exit 0
          fi
          git commit -m 'docs: add verified plugin installation guide'
          git push origin HEAD:main
